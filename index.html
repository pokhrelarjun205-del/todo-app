<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Todo App</title>
    <script
      src="https://kit.fontawesome.com/576ee3e0f8.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <form action="">
          <div class="add-task-wrapper">
            <input
              type="text"
              name=""
              id=""
              required
              autocomplete="off"
              placeholder="Enter Your Tasks..."
            />
          </div>
          <button type="submit">
            <i class="fa-regular fa-square-plus"></i><span>Add Task</span>
          </button>
        </form>
        <div class="task-list">
          <ul>
            <li>
              <div class="small-box">
                <div class="completed-mark">
                  <input type="checkbox" name="completed" />
                </div>
                <span class="task-content">Buy Milk</span>
              </div>
              <div class="task-action">
                <div class="edit-button">
                  <button class="edit-btn">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                </div>
                <div class="delete-button">
                  <button class="del-btn">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
