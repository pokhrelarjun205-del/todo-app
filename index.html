<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/496d548f22.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="task">
          <input
            type="text"
            name="task-input"
            id="task-input"
            placeholder="Enter task"
          />
        </div>
        <div class="add-task">
          <button class="task-btn">
            <i class="fa-solid fa-plus"></i>Add task
          </button>
        </div>
        <div class="error_box">Welcome to my todo app</div>
        <ul class="task-list"></ul>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
